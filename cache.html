<html manifest="offlinexmb.cache">
<head>
<title>PSFree-Lapse Exploit For 9.00</title>
<style>
body {
  background: linear-gradient(135deg, #063FAB, #01258A, #000033);
  color: white;
  font-size: 28px;
  text-align: center;
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.container {
  width: 80%;
  max-width: 600px;
}
.title {
  font-size: 32px;
  margin-bottom: 30px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}
.progress-container {
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 5px;
  margin: 20px 0;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}
.progress-text {
  margin: 10px 0;
  font-size: 24px;
}
@keyframes pulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}
.pulse {
  animation: pulse 1.5s infinite ease-in-out;
}
</style>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){
  Percent = Math.round(e.loaded / e.total * 100);
  msgs.innerHTML = "تثبيت التخزين المؤقت ... " + Percent + "%";
}
function DisplayCacheProgress(){
  msgs.innerHTML = "تم تثبيت التخزين المؤقت بنجاح";
  msgs.classList.remove("pulse");
  setTimeout(function(){location.reload();}, 3000);
}
window.onload = function() {
  msgs.classList.add("pulse");
};
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
</script>
</head>
<body>
<div class="container">
  <div class="title">PSFree-Lapse Exploit</div>
  <div class="progress-container">
    <div id="msgs" class="progress-text pulse">جاري التحميل...</div>
  </div>
</div>
</body>
</html>
